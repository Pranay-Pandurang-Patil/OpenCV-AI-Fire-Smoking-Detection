<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Safety Monitoring System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <h1>🔥 AI Safety Monitoring System</h1>

        <p>
            AI-powered Fire & Cigarette Smoking Detection
        </p>

    </header>


    <main class="container">

        <!-- Detection Mode -->

        <section class="card">

            <h2>Detection Mode</h2>

            <div class="mode-buttons">

                <button
                    id="fireBtn"
                    class="mode-btn active"
                    onclick="selectMode('fire')">
                    🔥 Fire Detection
                </button>

                <button
                    id="smokingBtn"
                    class="mode-btn"
                    onclick="selectMode('smoking')">
                    🚬 Cigarette Smoking
                </button>

            </div>

        </section>


        <!-- Upload -->

        <section class="card">

            <h2>Upload Image</h2>

            <div
                id="dropZone"
                class="drop-zone">

                <div class="upload-icon">
                    📁
                </div>

                <h3>
                    Drag & Drop your image here
                </h3>

                <p>
                    or
                </p>

                <label
                    for="fileInput"
                    class="browse-btn">

                    Browse Files

                </label>

                <input
                    id="fileInput"
                    type="file"
                    accept=".jpg,.jpeg,.png"
                    hidden>

                <p class="supported">
                    Supported: JPG, JPEG, PNG
                </p>

            </div>

        </section>


        <!-- Status -->

        <section class="card">

            <h2>Status</h2>

            <div id="status">
                🟢 Ready
            </div>

        </section>


        <!-- Results -->

        <section
            id="resultSection"
            class="card result-section">

            <h2>Detection Result</h2>

            <div class="result-container">

                <img
                    id="resultImage"
                    alt="Detection Result">

            </div>

        </section>

    </main>


    <footer>

        <p>
            AI Safety Monitoring System • OpenCV + YOLO
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
